name: Build and Deploy to AKS

on:
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: dev-veera-narni
  AKS_CLUSTER_NAME: bankingapp-aks
  ACR_NAME: bankingappveeraacr
  ACR_LOGIN_SERVER: bankingappveeraacr.azurecr.io
  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build all Docker images(banking, cards, loans, transactions and push to ACR
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build banking-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/banking-ui:${{ env.IMAGE_TAG }} ./frontend/banking-ui

      - name: Build cards-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/cards-ui:${{ env.IMAGE_TAG }} ./frontend/cards-ui

      - name: Build transactions-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/transactions-ui:${{ env.IMAGE_TAG }} ./frontend/transactions-ui

      - name: Build loans-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/loans-ui:${{ env.IMAGE_TAG }} ./frontend/loans-ui

      - name: Build backend-service
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend-service:${{ env.IMAGE_TAG }} ./backend

      - name: Push all images to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/banking-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/cards-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/transactions-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/loans-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend-service:${{ env.IMAGE_TAG }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to AKS
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Update image tags in K8s manifests
        run: |
          set -euo pipefail
          update_image() {
            file="$1"; image="$2"
            # Rewrites the whole "image:" line, so it works whether the file
            # still holds the IMAGE_* placeholder or a previously committed tag.
            sed -i -E "s#^([[:space:]]*)image:[[:space:]].*#\1image: ${image}#" "$file"
          }
          update_image k8s/03-backend-service.yaml  "${ACR_LOGIN_SERVER}/backend-service:${IMAGE_TAG}"
          update_image k8s/04-banking-ui.yaml       "${ACR_LOGIN_SERVER}/banking-ui:${IMAGE_TAG}"
          update_image k8s/05-cards-ui.yaml         "${ACR_LOGIN_SERVER}/cards-ui:${IMAGE_TAG}"
          update_image k8s/06-transactions-ui.yaml  "${ACR_LOGIN_SERVER}/transactions-ui:${IMAGE_TAG}"
          update_image k8s/07-loans-ui.yaml         "${ACR_LOGIN_SERVER}/loans-ui:${IMAGE_TAG}"
          grep -n "image:" k8s/*.yaml

      - name: Commit updated manifests back to repo
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/03-backend-service.yaml k8s/04-banking-ui.yaml \
                  k8s/05-cards-ui.yaml k8s/06-transactions-ui.yaml \
                  k8s/07-loans-ui.yaml
          if git diff --cached --quiet; then
            echo "Manifests already up to date - nothing to commit."
            exit 0
          fi
          git commit -m "ci: update k8s image tags to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy to cluster
        run: kubectl apply -f k8s/

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/backend-service -n banking-app --timeout=180s
          kubectl rollout status deployment/banking-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/cards-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/transactions-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/loans-ui -n banking-app --timeout=180s

      - name: Print Application URL
        run: |
          echo "============================================"
          echo "  ✅ Deployment Successful!"
          echo "============================================"
          LB_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo ""
          echo "  🌐 Application URL: http://$LB_IP"
          echo ""
          echo "  📄 Pages:"
          echo "     Home:          http://$LB_IP"
          echo "     Cards:         http://$LB_IP/cards"
          echo "     Transactions:  http://$LB_IP/transactions"
          echo "     Loans:         http://$LB_IP/loans"
          echo ""
          echo "============================================"
