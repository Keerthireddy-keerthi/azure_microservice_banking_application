name: Build and Deploy to AKS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: data
  AKS_CLUSTER_NAME: bankingapp-aks
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build all Docker images and push to ACR
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build banking-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/banking-ui:${{ env.IMAGE_TAG }} ./frontend/banking-ui

      - name: Build cards-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/cards-ui:${{ env.IMAGE_TAG }} ./frontend/cards-ui

      - name: Build transactions-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/transactions-ui:${{ env.IMAGE_TAG }} ./frontend/transactions-ui

      - name: Build loans-ui
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/loans-ui:${{ env.IMAGE_TAG }} ./frontend/loans-ui

      - name: Build backend-service
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend-service:${{ env.IMAGE_TAG }} ./backend

      - name: Push all images to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/banking-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/cards-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/transactions-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/loans-ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend-service:${{ env.IMAGE_TAG }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to AKS
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Update image tags in K8s manifests
        run: |
          sed -i "s|IMAGE_BANKING_UI|${{ env.ACR_LOGIN_SERVER }}/banking-ui:${{ env.IMAGE_TAG }}|g" k8s/04-banking-ui.yaml
          sed -i "s|IMAGE_CARDS_UI|${{ env.ACR_LOGIN_SERVER }}/cards-ui:${{ env.IMAGE_TAG }}|g" k8s/05-cards-ui.yaml
          sed -i "s|IMAGE_TRANSACTIONS_UI|${{ env.ACR_LOGIN_SERVER }}/transactions-ui:${{ env.IMAGE_TAG }}|g" k8s/06-transactions-ui.yaml
          sed -i "s|IMAGE_LOANS_UI|${{ env.ACR_LOGIN_SERVER }}/loans-ui:${{ env.IMAGE_TAG }}|g" k8s/07-loans-ui.yaml
          sed -i "s|IMAGE_BACKEND_SERVICE|${{ env.ACR_LOGIN_SERVER }}/backend-service:${{ env.IMAGE_TAG }}|g" k8s/03-backend-service.yaml

      - name: Deploy to cluster
        run: kubectl apply -f k8s/

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/backend-service -n banking-app --timeout=180s
          kubectl rollout status deployment/banking-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/cards-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/transactions-ui -n banking-app --timeout=180s
          kubectl rollout status deployment/loans-ui -n banking-app --timeout=180s
