name: Terraform - Provision Azure Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_STATE_RG: terraform-state-rg
  TF_STATE_SA: vaboraterraformstate
  TF_STATE_CONTAINER: tfstate

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Create Storage Account for Terraform state if it doesn't exist
      - name: Create Terraform state storage (if not exists)
        run: |
          # Check if resource group exists, create if not
          az group show --name ${{ env.TF_STATE_RG }} 2>/dev/null || \
            az group create --name ${{ env.TF_STATE_RG }} --location eastus

          # Check if storage account exists, create if not
          SA_EXISTS=$(az storage account show --name ${{ env.TF_STATE_SA }} --resource-group ${{ env.TF_STATE_RG }} --query "name" -o tsv 2>/dev/null || echo "")
          if [ -z "$SA_EXISTS" ]; then
            echo "Creating storage account..."
            az storage account create \
              --name ${{ env.TF_STATE_SA }} \
              --resource-group ${{ env.TF_STATE_RG }} \
              --location eastus \
              --sku Standard_LRS
          else
            echo "Storage account already exists, skipping..."
          fi

          # Check if blob container exists, create if not
          CONTAINER_EXISTS=$(az storage container show --name ${{ env.TF_STATE_CONTAINER }} --account-name ${{ env.TF_STATE_SA }} --query "name" -o tsv 2>/dev/null || echo "")
          if [ -z "$CONTAINER_EXISTS" ]; then
            echo "Creating blob container..."
            az storage container create \
              --name ${{ env.TF_STATE_CONTAINER }} \
              --account-name ${{ env.TF_STATE_SA }}
          else
            echo "Blob container already exists, skipping..."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # ─────────────────────────────────────────────────────────────────────
      # After Apply — Update ConfigMap yaml with real MySQL values
      # ─────────────────────────────────────────────────────────────────────
      - name: Get Terraform Outputs
        if: github.event.inputs.action == 'apply'
        id: tf_output
        run: |
          echo "MYSQL_HOST=$(terraform output -raw mysql_fqdn)" >> $GITHUB_OUTPUT
          echo "MYSQL_USER=$(terraform output -raw mysql_admin_username)" >> $GITHUB_OUTPUT
          echo "MYSQL_PASSWORD=$(terraform output -raw mysql_admin_password)" >> $GITHUB_OUTPUT

      - name: Update ConfigMap yaml with MySQL values
        if: github.event.inputs.action == 'apply'
        run: |
          cd $GITHUB_WORKSPACE
          sed -i "s|REPLACE_MYSQL_HOST|${{ steps.tf_output.outputs.MYSQL_HOST }}|g" k8s/02-configmap.yaml
          sed -i "s|REPLACE_DB_USER|${{ steps.tf_output.outputs.MYSQL_USER }}|g" k8s/02-configmap.yaml
          sed -i "s|REPLACE_DB_PASSWORD|${{ steps.tf_output.outputs.MYSQL_PASSWORD }}|g" k8s/02-configmap.yaml

      - name: Commit updated ConfigMap
        if: github.event.inputs.action == 'apply'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/02-configmap.yaml
          git commit -m "Update configmap with MySQL connection details from Terraform" || echo "No changes to commit"
          git push
