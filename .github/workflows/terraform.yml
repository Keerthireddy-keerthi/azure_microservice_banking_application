name: Terraform - Provision Azure Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # ─────────────────────────────────────────────────────────────────────
      # After Apply — Update ConfigMap with real MySQL values and apply to AKS
      # ─────────────────────────────────────────────────────────────────────
      - name: Get Terraform Outputs
        if: github.event.inputs.action == 'apply'
        id: tf_output
        run: |
          echo "MYSQL_HOST=$(terraform output -raw mysql_fqdn)" >> $GITHUB_OUTPUT
          echo "MYSQL_USER=$(terraform output -raw mysql_admin_username)" >> $GITHUB_OUTPUT
          echo "MYSQL_PASSWORD=$(terraform output -raw mysql_admin_password)" >> $GITHUB_OUTPUT
          echo "AKS_CLUSTER=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT

      - name: Azure Login
        if: github.event.inputs.action == 'apply'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        if: github.event.inputs.action == 'apply'
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ steps.tf_output.outputs.RESOURCE_GROUP }}
          cluster-name: ${{ steps.tf_output.outputs.AKS_CLUSTER }}

      - name: Update ConfigMap and apply to AKS
        if: github.event.inputs.action == 'apply'
        run: |
          cd $GITHUB_WORKSPACE
          sed -i "s|REPLACE_MYSQL_HOST|${{ steps.tf_output.outputs.MYSQL_HOST }}|g" k8s/02-configmap.yaml
          sed -i "s|REPLACE_DB_USER|${{ steps.tf_output.outputs.MYSQL_USER }}|g" k8s/02-configmap.yaml
          sed -i "s|REPLACE_DB_PASSWORD|${{ steps.tf_output.outputs.MYSQL_PASSWORD }}|g" k8s/02-configmap.yaml
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-configmap.yaml
