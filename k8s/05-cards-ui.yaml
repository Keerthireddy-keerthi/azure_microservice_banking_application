# ─────────────────────────────────────────────────────────────────────────────
# Cards UI — Static frontend (nginx, port 8081)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-ui
  namespace: banking-app
  labels:
    app: cards-ui
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cards-ui
  template:
    metadata:
      labels:
        app: cards-ui
        tier: frontend
    spec:
      containers:
        - name: cards-ui
          image: IMAGE_CARDS_UI
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cards-ui
  namespace: banking-app
  labels:
    app: cards-ui
    tier: frontend
spec:
  selector:
    app: cards-ui
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
