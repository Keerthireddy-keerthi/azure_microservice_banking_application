# ─────────────────────────────────────────────────────────────────────────────
# Cards UI — Static frontend (nginx, port 8081)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-ui
  namespace: banking-app
  labels:
    app: cards-ui
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cards-ui
  template:
    metadata:
      labels:
        app: cards-ui
        tier: frontend
    spec:
      containers:
        - name: cards-ui
          image: bankingappveeraacr.azurecr.io/cards-ui:7a571bc00488b355ddd172caa74bb696c1cdd154
          env:
            - name: BACKEND_URL
              value: "http://backend-service.banking-app.svc.cluster.local:8080"
            # Restrict envsubst to BACKEND_URL so nginx's own $host/$uri/... survive
            - name: NGINX_ENVSUBST_FILTER
              value: "BACKEND_URL"
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cards-ui
  namespace: banking-app
  labels:
    app: cards-ui
    tier: frontend
spec:
  selector:
    app: cards-ui
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
