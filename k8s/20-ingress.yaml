# Requires the ingress-nginx controller installed in the cluster:
# helm install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-app-ingress
  namespace: banking-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: banking.example.com   # replace with your domain, or use the LB IP directly
      http:
        paths:
          # Main homepage
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: banking-ui
                port:
                  number: 3000
          # Cards frontend
          - path: /cards(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cards-ui
                port:
                  number: 8081
          # Transactions frontend
          - path: /transactions(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: transactions-ui
                port:
                  number: 8082
          # Loans frontend
          - path: /loans(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: loans-ui
                port:
                  number: 8083
