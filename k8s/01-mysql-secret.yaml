# Populate real values via CI/CD (kubectl create secret / GitHub Actions secrets),
# do NOT commit real credentials. This file is a template showing expected keys.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: banking-app
type: Opaque
stringData:
  DB_HOST: "REPLACE_WITH_MYSQL_FQDN"        # e.g. bankingapp-mysql.mysql.database.azure.com
  DB_USER: "REPLACE_WITH_DB_USER"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DB_PORT: "3306"
