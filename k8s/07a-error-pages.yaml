# ─────────────────────────────────────────────────────────────────────────────
# error-pages — animated 404 "Good bye" page shown when any frontend service
# (cards-ui, transactions-ui, loans-ui, banking-ui) has no ready pods.
#
# Wired in via annotations on k8s/08-ingress.yaml:
#   nginx.ingress.kubernetes.io/default-backend: error-pages
#   nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: banking-app
  labels:
    app: error-pages
    tier: frontend
spec:
  # Two replicas: this must stay up precisely when other things are down.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: error-pages
  template:
    metadata:
      labels:
        app: error-pages
        tier: frontend
    spec:
      containers:
        - name: error-pages
          image: IMAGE_ERROR_PAGES
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: banking-app
  labels:
    app: error-pages
    tier: frontend
spec:
  selector:
    app: error-pages
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
