# ─────────────────────────────────────────────────────────────────────────────
# MySQL credentials secret (created via CI/CD, this is a reference template)
# Do NOT commit real values — CI/CD creates this secret from GitHub Secrets
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: banking-app
type: Opaque
stringData:
  DB_HOST: "REPLACE_MYSQL_FQDN"
  DB_USER: "REPLACE_DB_USER"
  DB_PASSWORD: "REPLACE_DB_PASSWORD"
  DB_PORT: "3306"
