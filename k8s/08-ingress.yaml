# ─────────────────────────────────────────────────────────────────────────────
# NGINX Ingress — Routes traffic to frontend UIs
# Backend is NOT exposed here (frontends proxy /api internally)
# ─────────────────────────────────────────────────────────────────────────────
# Prerequisites:
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-app-ingress
  namespace: banking-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: banking-ui
                port:
                  number: 3000
          - path: /cards(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cards-ui
                port:
                  number: 8081
          - path: /transactions(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: transactions-ui
                port:
                  number: 8082
          - path: /loans(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: loans-ui
                port:
                  number: 8083
