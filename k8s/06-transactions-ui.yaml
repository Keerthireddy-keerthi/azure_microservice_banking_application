# ─────────────────────────────────────────────────────────────────────────────
# Transactions UI — Static frontend (nginx, port 8082)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-ui
  namespace: banking-app
  labels:
    app: transactions-ui
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: transactions-ui
  template:
    metadata:
      labels:
        app: transactions-ui
        tier: frontend
    spec:
      containers:
        - name: transactions-ui
          image: bankingappveeraacr.azurecr.io/transactions-ui:572dad9a578bd514ce485e735c23bcbe414174f2
          env:
            - name: BACKEND_URL
              value: "http://backend-service.banking-app.svc.cluster.local:8080"
            # Restrict envsubst to BACKEND_URL so nginx's own $host/$uri/... survive
            - name: NGINX_ENVSUBST_FILTER
              value: "BACKEND_URL"
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-ui
  namespace: banking-app
  labels:
    app: transactions-ui
    tier: frontend
spec:
  selector:
    app: transactions-ui
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
