<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards - Veera_NareshIT_Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f1624 0%, #1a2744 50%, #0d2137 100%); min-height: 100vh; color: #e0e6ed; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cardFlipIn { from { opacity: 0; transform: rotateY(-90deg); } to { opacity: 1; transform: rotateY(0deg); } }
    @keyframes ripple { to { transform: scale(3); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .ripple-btn { position: relative; overflow: hidden; }
    .ripple-btn .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.5); transform: scale(0); animation: ripple 0.6s ease-out; pointer-events: none; }

    .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: rgba(15,22,36,0.95); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 0; z-index: 100; }
    .sidebar .brand { padding: 0 24px; margin-bottom: 40px; }
    .sidebar .brand h2 { font-size: 1.15rem; background: linear-gradient(135deg, #4facfe, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
    .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: #7a8fa6; text-decoration: none; font-size: 0.9rem; transition: all 0.2s; border-left: 3px solid transparent; }
    .sidebar nav a:hover { color: #e0e6ed; background: rgba(79,172,254,0.05); transform: translateX(4px); }
    .sidebar nav a.active { color: #4facfe; background: rgba(79,172,254,0.08); border-left-color: #4facfe; }
    .sidebar nav a .nav-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .sidebar .user-section { position: absolute; bottom: 24px; left: 0; right: 0; padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06); }
    .sidebar .user-section .user-info { display: flex; align-items: center; gap: 12px; }
    .sidebar .user-section .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4facfe, #00f2fe); display: flex; align-items: center; justify-content: center; font-weight: 600; color: #0a1628; }
    .sidebar .user-section .user-name { font-size: 0.9rem; color: #e0e6ed; }
    .sidebar .user-section .user-acc { font-size: 0.75rem; color: #7a8fa6; }
    .sidebar .logout-btn { margin-top: 12px; width: 100%; padding: 10px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all .2s; }
    .sidebar .logout-btn:hover { background: rgba(239,68,68,0.2); }

    .main-content { margin-left: 260px; padding: 32px 40px; animation: fadeInUp 0.5s ease; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .page-header p { color: #7a8fa6; margin-top: 4px; }
    .btn-add { padding: 12px 24px; background: linear-gradient(135deg, #4facfe, #00f2fe); border: none; border-radius: 12px; color: #0a1628; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,172,254,0.3); }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
    .bank-card { background: linear-gradient(135deg, #1e3a5f 0%, #0f2439 100%); border: 1px solid rgba(79,172,254,0.15); border-radius: 20px; padding: 28px; position: relative; overflow: hidden; transition: transform 0.3s; animation: fadeInUp 0.5s ease both; }
    .bank-card:hover { transform: translateY(-6px); }
    .bank-card::before { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(79,172,254,0.05) 0%, transparent 70%); }
    .bank-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; position: relative; }
    .bank-card .card-type { font-size: 0.8rem; color: #7a8fa6; text-transform: uppercase; letter-spacing: 1px; }
    .bank-card .card-network { font-size: 1.5rem; font-weight: 700; color: #4facfe; }
    .bank-card .card-number { font-size: 1.4rem; letter-spacing: 4px; color: #fff; margin-bottom: 24px; font-weight: 300; position: relative; }
    .bank-card .card-footer { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
    .bank-card .card-expiry label { font-size: 0.7rem; color: #7a8fa6; text-transform: uppercase; display: block; }
    .bank-card .card-expiry span { font-size: 0.9rem; color: #e0e6ed; }
    .bank-card .card-status { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: rgba(34,197,94,0.15); color: #34d399; }
    .status-blocked { background: rgba(239,68,68,0.15); color: #f87171; }
    .card-actions { display: flex; gap: 8px; margin-top: 16px; position: relative; }
    .card-actions button { padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #e0e6ed; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .card-actions button:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }

    .empty-state { text-align: center; padding: 80px 40px; color: #7a8fa6; }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { color: #c8d6e5; margin-bottom: 8px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; animation: fadeIn .25s ease; }
    .modal { background: #1a2744; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 36px; width: 90%; max-width: 440px; animation: cardFlipIn 0.4s ease; }
    .modal h3 { color: #fff; font-size: 1.3rem; margin-bottom: 24px; }
    .modal .form-group { margin-bottom: 16px; }
    .modal .form-group label { display: block; font-size: 0.85rem; color: #7a8fa6; margin-bottom: 6px; }
    .modal .form-group select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.9rem; }
    .modal .form-group select option { background: #1a2744; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-actions .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #7a8fa6; cursor: pointer; }
    .modal-actions .btn-submit { flex: 1; padding: 12px; background: linear-gradient(135deg, #4facfe, #00f2fe); border: none; border-radius: 10px; color: #0a1628; font-weight: 600; cursor: pointer; }

    .no-auth { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .no-auth .msg { text-align: center; }
    .no-auth .msg h2 { color: #fff; margin-bottom: 12px; }
    .no-auth .msg a { color: #4facfe; text-decoration: none; }

    .toast { position: fixed; bottom: 28px; right: 28px; z-index: 2000; padding: 16px 22px; border-radius: 14px; background: #12351f; border: 1px solid rgba(34,197,94,0.4); color: #86efac; font-size: 0.9rem; box-shadow: 0 15px 35px rgba(0,0,0,0.4); animation: fadeInUp .3s ease; display: none; }
    .toast.error { background: #351212; border-color: rgba(239,68,68,0.4); color: #fca5a5; }

    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 20px; } }
  </style>
</head>
<body>
  <div id="noAuth" class="no-auth" style="display:none;">
    <div class="msg"><h2>Please sign in first</h2><a href="/">Go to Login</a></div>
  </div>

  <div id="appSection" style="display:none;">
    <aside class="sidebar">
      <div class="brand"><h2>🏦 Veera_NareshIT_Bank</h2></div>
      <nav>
        <a href="/"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="/cards" class="active"><span class="nav-icon">💳</span> Cards</a>
        <a href="/transactions"><span class="nav-icon">📊</span> Transactions</a>
        <a href="/loans"><span class="nav-icon">🏦</span> Loans</a>
      </nav>
      <div class="user-section">
        <div class="user-info">
          <div class="avatar" id="userAvatar">U</div>
          <div><div class="user-name" id="userName">User</div><div class="user-acc" id="userAccount">-</div></div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div><h1>My Cards</h1><p>Manage your debit and credit cards</p></div>
        <button class="btn-add ripple-btn" onclick="openModal()">+ New Card</button>
      </div>
      <div id="cardsContainer" class="cards-grid"></div>
    </main>
  </div>

  <div id="cardModal" class="modal-overlay">
    <div class="modal">
      <h3>Request New Card</h3>
      <div class="form-group">
        <label>Card Type</label>
        <select id="cardType"><option value="DEBIT">Debit Card</option><option value="CREDIT">Credit Card</option></select>
      </div>
      <div class="form-group">
        <label>Card Network</label>
        <select id="cardNetwork"><option value="RUPAY">RuPay</option><option value="VISA">Visa</option><option value="MASTERCARD">Mastercard</option></select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-submit ripple-btn" onclick="requestCard()">Request Card</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Routed through this service's OWN nginx: the ingress strips the /cards
    // prefix, then cards-ui proxies /api/ to backend-service. Keeps the
    // cards service independent of banking-ui.
    const API = '/cards/api';
    let user = JSON.parse(localStorage.getItem('user') || 'null');
    let account = JSON.parse(localStorage.getItem('account') || 'null');

    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.ripple-btn');
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    });

    function showToast(message, isError) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function handleLogout() { localStorage.removeItem('user'); localStorage.removeItem('account'); window.location.href = '/'; }
    function openModal() { document.getElementById('cardModal').classList.add('show'); }
    function closeModal() { document.getElementById('cardModal').classList.remove('show'); }

    async function loadCards() {
      try {
        const res = await fetch(`${API}/cards/${account.id}`);
        const cards = await res.json();
        const container = document.getElementById('cardsContainer');
        if (!Array.isArray(cards) || cards.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="empty-icon">💳</div><h3>No Cards Yet</h3><p>Request your first card to get started</p></div>';
          return;
        }
        container.innerHTML = cards.map((c, i) => `
          <div class="bank-card" style="animation-delay:${i * 0.08}s">
            <div class="card-header">
              <span class="card-type">${c.card_type} Card</span>
              <span class="card-network">${c.card_network || 'RUPAY'}</span>
            </div>
            <div class="card-number">${c.card_number_masked}</div>
            <div class="card-footer">
              <div class="card-expiry"><label>Expires</label><span>${c.expiry_date || 'N/A'}</span></div>
              <span class="card-status status-${c.status.toLowerCase()}">${c.status}</span>
            </div>
            ${c.credit_limit > 0 ? `<div style="margin-top:16px;font-size:0.8rem;color:#7a8fa6;">Limit: ₹${parseFloat(c.credit_limit).toLocaleString()} | Available: ₹${parseFloat(c.available_balance).toLocaleString()}</div>` : ''}
            <div class="card-actions">
              ${c.status === 'ACTIVE' ? `<button onclick="blockCard(${c.id})">🔒 Block Card</button>` : `<button disabled style="opacity:0.5">Blocked</button>`}
            </div>
          </div>`).join('');
      } catch (e) { console.error(e); }
    }

    async function requestCard() {
      const card_type = document.getElementById('cardType').value;
      const card_network = document.getElementById('cardNetwork').value;
      try {
        const res = await fetch(`${API}/cards`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: account.id, card_type, card_network })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          closeModal(); loadCards();
          showToast('Card issued successfully!');
        } else {
          showToast(data.message || 'Failed to issue card', true);
        }
      } catch (e) { console.error(e); showToast('Something went wrong', true); }
    }

    async function blockCard(id) {
      if (!confirm('Are you sure you want to block this card?')) return;
      await fetch(`${API}/cards/${id}/block`, { method: 'PATCH' });
      showToast('Card blocked');
      loadCards();
    }

    if (!user || !account) {
      document.getElementById('noAuth').style.display = 'flex';
    } else {
      document.getElementById('appSection').style.display = 'block';
      document.getElementById('userName').textContent = user.full_name;
      document.getElementById('userAccount').textContent = account.account_number;
      document.getElementById('userAvatar').textContent = user.full_name.charAt(0).toUpperCase();
      loadCards();
    }
  </script>
</body>
</html>
