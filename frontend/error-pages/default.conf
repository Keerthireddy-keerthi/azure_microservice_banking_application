# ─────────────────────────────────────────────────────────────────────────────
# error-pages — custom error backend for the NGINX Ingress.
#
# The ingress sends a request here whenever an upstream frontend service has
# no ready endpoints (or returns a code listed in custom-http-errors). It
# forwards these headers, which we surface on the page via SSI:
#   X-Code, X-Format, X-Original-URI, X-Namespace, X-Ingress-Name, X-Service-Name
# ─────────────────────────────────────────────────────────────────────────────

# Browsers get the animated HTML page; XHR/fetch clients that asked for JSON
# get a JSON body, so the SPA's error handling does not choke on markup.
map $http_x_format $error_body {
    default   /index.html;
    ~*json    /error.json;
}

server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;

    ssi on;
    ssi_types text/html application/json;

    # Serve the animated page with a 404 status, as requested.
    error_page 404 $error_body;

    # Kubernetes probes must not get the error page.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"error-pages"}';
    }

    location = /index.html {
        internal;
        default_type text/html;
    }

    location = /error.json {
        internal;
        default_type application/json;
    }

    # Everything else is an error request - raise 404 so error_page renders.
    location / {
        return 404;
    }
}
